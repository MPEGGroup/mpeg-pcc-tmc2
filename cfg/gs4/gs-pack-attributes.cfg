# V3C_GVD + 2 x V3C_PVD configuration packing only attributes

# Pack only attributes
packGeometry                    : 0
packAttributes                  : 1

# The first packed video sub-bitstream will have scale, opacity and rotation attributes. The second packed video
# sub-bitstream will have color/spherical harmonics attributes.
attributeScalePackedMapIndex    : 0
attributeOpacityPackedMapIndex  : 0
attributeRotationPackedMapIndex : 0
attributeColorPackedMapIndex    : 1

# This configuration mimics the behavior of packAttribute: 1 in m75002v3, whereby both packed video sub-bitstream used
# four columns.
packedMapColumnsCount           : 4,4
