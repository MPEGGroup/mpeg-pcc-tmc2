# Example VUI config for GS4 (Phase 1 parameters)
# 25 fps timing example

# Enable ASPS VUI
aspsVuiParametersPresentFlag      : 1

# Timing info
vuiTimingInfoPresentFlag          : 1
vuiNumUnitsInTick                 : 1080000
vuiTimeScale                      : 27000000
vuiPocProportionalToTimingFlag    : 1
vuiNumTicksPocDiffOneMinus1       : 0
vuiHrdParametersPresentFlag       : 0

# Coordinate unit
vuiUnitInMetresFlag               : 1

# Display box info
# For geometryBitDepth3D = 18, valid range is 0..262143
vuiDisplayBoxInfoPresentFlag      : 1
vuiDisplayBoxOriginX              : 0
vuiDisplayBoxOriginY              : 0
vuiDisplayBoxOriginZ              : 0
vuiDisplayBoxSizeX                : 131072
vuiDisplayBoxSizeY                : 131072
vuiDisplayBoxSizeZ                : 131072

# Anchor point
# Current implementation writes anchor only when display box is present
vuiAnchorPointPresentFlag         : 1
vuiAnchorPointX                   : 1
vuiAnchorPointY                   : 1
vuiAnchorPointZ                   : 1