#----------------------------------------------------------------------------------------------------------------------#
#                                                                                                                      #
#                                             V-PCC GS anchor configuration                                            #
#                                                                                                                      #
#----------------------------------------------------------------------------------------------------------------------#


### Experiment options #################################################################################################

# keepIntermediateFiles               : 0     # Keep intermediate files: RGB, YUV and bin


### GS4 encoder options (flags and modes) ##############################################################################

# adaptivePcaEnabled                  : 0     # Enable adaptive global/group PCA selection (m76164)
adaptiveQuantizationMode              : 1     # Adaptive SH quantization mode: 0=log, 1=percentile
dataAdaptiveShTransformEnabled        : 1     # Enable data adaptive SH transform (m75790)
enableAdaptiveShQuantization          : 1     # Enable adaptive SH quantization
# enableDuplicateMerging              : 0     # Enable merging of duplicate positions (default: 0)
enableOpacityNonUniformQuantization   : 1     # Enable non-uniform quantization for opacity (m76122)
enableScaleNonUniformQuantization     : 1     # Enable non-uniform quantization for Scale (m76123)
enableScalePowerTransform             : 1     # Enable power transform + 2-segment PLS for scale (m76151)
# enableShDimensionReduction          : 0     # Enable SH dimension reduction after 2D transform (m76859)
enableShNonUniformQuantization        : 1     # Enable non-uniform quantization for SH (m75025)
gsdPcaDcFlag                          : 1     # Enable PCA for DC component of SH (m76858)
gsdTransform2dPresentFlag             : 1     # Enable 2D transform for SH (m75038 or m75790)
# keepZeroShBitGaussians              : 0     # Keep Gaussians that have an adaptive bit depth of 0 (no pruning)
# rawPatchDataArrangementMethod       : 0     # Raw patch data arrangement method: 0=sequential, 1=vertical planar (m76580)
# rotQuaternionRepresentationType     : 0     # Rotation representation: 0=3-component tangent-space x/w,y/w,z/w (default), 1=4-component w,x,y,z
# shPredictionEnabled                 : 0     # Enable SH linear prediction (m76155)


### GS4 encoder parameters #############################################################################################

# attributeBitDepth2D                 : 10    # Bit depth for 2D attribute representation
# blockBasedSortBlockSize             : 64    # Block size for raw_patch_data_arrangement_method=1 (must be power of 2, >=8, default = 64)
# geometryBitDepth2D                  : 10    # Bit depth for 2D geometry representation
# geometryBitDepth3D                  : 18    # Bit depth for 3D geometry coordinates
# minimumImageWidth                   : 1024  # Minimum width of packed patch frame
# occupancyResolution                 : 1     # Occupancy resolution for raw points patches


### GS4 vdeo packing configuration #####################################################################################

attributeColorPackedMapIndex          : 1     # Packed map index for texture or SH attribute
# attributeOpacityPackedMapIndex      : 0     # Packed map index for opacity attribute
# attributeRotationPackedMapIndex     : 0     # Packed map index for rotation attribute
# attributeScalePackedMapIndex        : 0     # Packed map index for scale attribute
implicitPacking                       : 1     # Enable implicit packing (0(default): explicit mode, 1: implicit mode)
packAttributes                        : 1     # Pack attributes using the packed video extension (VPS_EXT_PACKED_2)
packedMapColumnsCount                 : 4,4   # Number of columns for each packed map (e.g., '4,8' for 4 columns in map 0, 8 in map 1)
# packGeometry                        : 0     # Pack geometry using the packed video extension (VPS_EXT_PACKED_2)
# temporalPacking                     : 0     # Temporal packing (0(default): disabled, 1: enabled)


### Video encoding configuration #######################################################################################

geometryConfig                        : hm/gs-main10-hm-geometry.cfg    # HM configuration file for geometry video compression
attributeConfig                       : hm/gs-main10-hm-attribute.cfg   # HM configuration file for attribute video compression
packConfig                            : hm/gs-main10-hm-pack.cfg        # HM configuration file for packed video compression

########################################################################################################################